name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3-pip python3-setuptools python3-wheel
        sudo apt install -y libssl-dev libffi-dev
        sudo apt install -y autoconf libtool pkg-config
        sudo apt install -y zlib1g-dev
        sudo apt install -y libncurses5-dev libncursesw5-dev libtinfo5
        sudo apt install -y libffi-dev libssl-dev
        sudo apt install -y openjdk-8-jdk
        sudo apt install -y ffmpeg
        pip3 install --upgrade pip
        pip3 install buildozer
        pip3 install cython

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Download Android NDK
      run: |
        cd $HOME
        wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip android-ndk-r25c-linux.zip
        mv android-ndk-r25c android-ndk-r25c

    - name: Build APK
      run: |
        export ANDROID_NDK_HOME=$HOME/android-ndk-r25c
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: android-apk
        path: bin/*.apk
        retention-days: 30

    - name: Get APK filename
      id: apk-info
      run: |
        APK_FILE=$(ls bin/*.apk | head -n 1)
        APK_NAME=$(basename "$APK_FILE")
        echo "apk-file=$APK_FILE" >> $GITHUB_OUTPUT
        echo "apk-name=$APK_NAME" >> $GITHUB_OUTPUT

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.apk-info.outputs.apk-file }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
