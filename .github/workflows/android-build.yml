name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
          pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
          libssl-dev ffmpeg ccache wget curl

    - name: Install Buildozer
      run: |
        python -m pip install --upgrade pip wheel setuptools
        python -m pip install buildozer cython

    - name: Prepare Android SDK path
      shell: bash
      run: |
        mkdir -p "$HOME/.buildozer/android/platform"
        echo "ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV

    - name: Install Android SDK + required build-tools
      shell: bash
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        set -e

        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

        if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ] && [ ! -x "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
          echo "Android SDK not initialized yet. Running buildozer android update sdk..."
          buildozer android update sdk --accept-licenses --filter platform-tools,platforms;android-33,build-tools;33.0.2,extras;android;m2repository,extras;google;m2repository,ndk;25.2.9519653
        fi

        if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
        elif [ -x "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
          SDKMGR="$SDK_DIR/cmdline-tools/bin/sdkmanager"
        else
          echo "sdkmanager not found in $SDK_DIR"
          exit 1
        fi

        yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

        "$SDKMGR" \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "extras;android;m2repository" \
          "extras;google;m2repository" \
          "ndk;25.2.9519653"

    - name: Build APK
      shell: bash
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: lasticproductions-debug-apk
        path: bin/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: bin/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
